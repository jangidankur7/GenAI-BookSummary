version: "3"

services:

  postgres:
    image: postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    # logging:
    #   options:
    #     max-size: 10m
    #     max-file: "3"
    ports:
      - '5438:5432'
    networks:
      - gen-ai-net
    volumes: 
      - ./db_migration/postgres-data:/var/lib/postgresql/data
      # copy the sql script to create tables
      - ./db_migration/tables_schema.sql:/docker-entrypoint-initdb.d/create_tables.sql

