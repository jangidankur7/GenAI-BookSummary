  #       condition: service_started
  #     ollama: 
  #       condition: service_started
      
  ollama:
    build: ollama
    ports:
      - 11434:11434
    networks:
      - gen-ai-net
    volumes:
      - ./ollama_model:/ollama
    # networks:
    #   - tutorial-net
    entrypoint: ["/usr/bin/bash", "/pull_model.sh"]

networks:
  gen-ai-net:
    driver: bridge

